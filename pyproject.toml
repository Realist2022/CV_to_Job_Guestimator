[project]
name = "cv-to-job-guestimator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "instructor>=1.15.4",
    "openai>=2.53.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "pypdf>=6.15.0",
    "pytesseract>=0.3.13",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "spacy>=3.8.15",
    # PresidioPIIDetector's spaCy NLP engine (see presidio_detector.py). Was
    # previously installed out-of-band via `spacy download`, so it wasn't in
    # uv.lock at all — `uv sync` silently removed it as an untracked
    # package. Declaring it here is what actually makes `presidio` (and
    # test_presidio_detector.py) work on a clean `uv sync`, including in CI.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
    "mypy>=1.19.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately narrow to start: F catches real mistakes (unused imports,
# undefined names — zero of these exist today, confirming the codebase has
# no dead imports to clean up); I is import ordering. E (pycodestyle) is
# left out for now: E501 alone found ~40 pre-existing long lines, several
# of them regex patterns or LLM prompt strings in src/prompts/templates.py
# where reflowing to fit a column limit risks changing meaning for no
# functional benefit. Revisit E501 as a deliberate formatting pass, not a
# side effect of adding lint infra.
select = ["F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Opt-in, not yet a CI gate — see .github/workflows/ci.yml. Narrow the
# exclude list as each module is brought under it.

