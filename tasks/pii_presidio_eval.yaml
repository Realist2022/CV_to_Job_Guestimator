name: pii_presidio_eval
description: >
  Runs PII redaction through the local Presidio+regex detector only (no
  LLM/Ollama in the PII path), to A/B against pii_redaction.yaml's
  model-based run on the same documents. Compare the pii_redaction line in
  PIPELINE TRACE (should show near-zero duration and no "attempts", since
  no LLM call happens for PII here) and the pii_spans/rejections in both
  artifacts to see coverage differences per PIIKind.
pipeline: extraction

models:
  evaluation: local-llama
  # Still required by the model-selection schema, but never called for PII
  # detection here: pii_detectors below omits "model".
  pii: local-llama

pii_detectors:
  - regex
  - presidio

inputs:
  job_listing:
    - dataSet/tradeMeJobListing/Job_listing.txt
    - dataSet/tradeMeJobListing/Job_listing.pdf
  candidate_cv:
    - dataSet/tradeMeCV/Sonny H Tapara CV.txt
    - dataSet/tradeMeCV/Sonny H Tapara CV.pdf

evaluation:
  min_pii_spans: 1
