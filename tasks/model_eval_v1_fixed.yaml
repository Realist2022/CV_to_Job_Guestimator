name: model_eval_v1_fixed
description: >
  Rollback benchmark. Same thresholds and documents as model_eval, but pinned
  to the Aug 24 2026 weights that cv-guestimator:v2 was promoted over. Kept
  after the promotion so a suspected v2 regression can be measured against the
  previous build: run this and model_eval back to back (so both see the same
  GPU thermal state) and diff with scripts/compare_runs.py. Delete once v2 has
  been trusted long enough that a rollback is no longer plausible.
pipeline: extraction

models:
  evaluation: cv-guestimator-v1-fixed

inputs:
  job_listing:
    - dataSet/tradeMeJobListing/Job_listing.txt
    - dataSet/tradeMeJobListing/Job_listing.pdf
  candidate_cv:
    - dataSet/tradeMeCV/Sonny H Tapara CV.txt
    - dataSet/tradeMeCV/Sonny H Tapara CV.pdf

# Thresholds deliberately identical to model_eval.yaml -- the two are only
# comparable if they're judged by the same bar.
evaluation:
  # Score gates, on top of configs/pipeline.yaml's default_evaluation --
  # max_execution_seconds and max_attempts are inherited from there, so the
  # bar this benchmark applies stays the same one every other run is held to
  # plus these two. Setting either to `null` here would opt out.
  min_final_relevance: 30
  min_skills_match: 30
