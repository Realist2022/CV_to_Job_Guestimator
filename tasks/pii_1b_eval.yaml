name: pii_1b_eval
description: >
  Same documents and evaluation model as cv_job_match.yaml, but pii swapped
  to local-llama-1b. Run this and cv_job_match.yaml back to back and compare
  the pii_redaction line in PIPELINE TRACE to A/B the smaller PII model.
  Requires: ollama pull llama3.2:1b
pipeline: extraction

models:
  evaluation: cv-guestimator
  pii: local-llama-1b

inputs:
  job_listing:
    - dataSet/tradeMeJobListing/Job_listing.txt
    - dataSet/tradeMeJobListing/Job_listing.pdf
  candidate_cv:
    - dataSet/tradeMeCV/Sonny H Tapara CV.txt
    - dataSet/tradeMeCV/Sonny H Tapara CV.pdf

evaluation:
  min_final_relevance: 0
