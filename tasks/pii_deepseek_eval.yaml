name: pii_deepseek_eval
description: >
  Same documents and evaluation model as cv_job_match.yaml, but pii swapped
  to local-deepseek-1.5b (already downloaded, no ollama pull needed). Run
  this alongside cv_job_match.yaml and pii_1b_eval.yaml and compare both the
  pii_redaction duration AND its "attempts" count in PIPELINE TRACE â€” a
  reasoning model can generate more tokens than it saves, and a retry there
  means its output isn't parsing as structured JSON on the first try.
pipeline: extraction

models:
  evaluation: cv-guestimator
  pii: local-deepseek-1.5b

inputs:
  job_listing:
    - dataSet/tradeMeJobListing/Job_listing.txt
    - dataSet/tradeMeJobListing/Job_listing.pdf
  candidate_cv:
    - dataSet/tradeMeCV/Sonny H Tapara CV.txt
    - dataSet/tradeMeCV/Sonny H Tapara CV.pdf

evaluation:
  min_final_relevance: 0
