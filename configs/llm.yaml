# Named model configurations. Tasks reference these by key.
# api_key_env values are resolved from the environment / .env at runtime.
models:
  gemini-flash:
    provider: openai_compatible
    model: gemini-3.1-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GOOGLE_API_KEY
    temperature: 0.0

  local-llama:
    provider: ollama
    model: llama3.2:latest
    base_url: http://localhost:11434/v1
    api_key: ollama
    temperature: 0.0

  # Fine-tuned LoRA model served by Ollama (see docker/ollama/Modelfile).
  # Enable once the model has been built with `ollama create`.
  cv-guestimator-lora:
    provider: ollama
    model: cv-guestimator-lora:latest
    base_url: http://localhost:11434/v1
    api_key: ollama
    temperature: 0.0
