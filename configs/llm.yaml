# Named model configurations. Tasks reference these by key.
# api_key_env values are resolved from the environment / .env at runtime.
models:
  gemini-flash:
    provider: openai_compatible
    model: gemini-3.1-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GOOGLE_API_KEY
    temperature: 0.0

  local-llama:
    provider: ollama
    model: llama3.2:latest
    base_url: http://localhost:11434/v1
    api_key: ollama
    temperature: 0.0

  # The promoted default: the fine-tuned build every everyday task resolves to.
  # Pinned to an explicit tag rather than :latest, so a run artifact's `engine`
  # string always names the exact weights that produced it and re-tagging in
  # Ollama can never silently change what a past run was measuring.
  # Promoting a future build = change this one line, then re-run
  # tasks/model_eval.yaml to confirm it still clears the thresholds.
  cv-guestimator:
    provider: ollama
    model: cv-guestimator:v2
    base_url: http://localhost:11434/v1
    api_key: ollama
    temperature: 0.0

  # Rollback / A-B control: the Aug 24 2026 weights (the build v2 replaced),
  # served from the same corrected Modelfile as the default above. Kept so a
  # suspected v2 regression can be checked against the previous build without
  # re-exporting anything -- `uv run main.py tasks/model_eval_v1_fixed.yaml`.
  cv-guestimator-v1-fixed:
    provider: ollama
    model: cv-guestimator:v1-fixed
    base_url: http://localhost:11434/v1
    api_key: ollama
    temperature: 0.0

  # The same fine-tuned LoRA as `cv-guestimator` above, served from Modal by
  # modal_app/inference.py instead of from local Ollama. Identical weights, so
  # a run against this and a run against the default are comparing hardware and
  # serving stack, not models.
  #
  # base_url_env rather than a literal: the endpoint is per-Modal-workspace
  # (https://<workspace>--cv-guestimator-serve.modal.run/v1), so it is not a
  # value that can be written into a config shared between developers. Deploy,
  # then put the printed URL in .env as MODAL_INFERENCE_URL along with
  # MODAL_API_KEY -- the same value as the cv-guestimator-api-key Modal secret,
  # which is what vLLM's --api-key checks as a bearer token.
  #
  # NOTE: a Modal cold start is minutes, not seconds, so the first run after a
  # scaledown will blow configs/pipeline.yaml's max_execution_seconds: 60. Warm
  # the endpoint first (`uv run modal run modal_app/inference.py`), or run this
  # from a task that raises or nulls that criterion.
  cv-guestimator-modal:
    provider: openai_compatible
    # vLLM's LORA_NAME in modal_app/inference.py. Use llama-3.2-3b-base instead
    # to hit the stock base model on the same endpoint and hardware -- the A/B
    # of the fine-tune against what it was trained from.
    model: cv-guestimator
    base_url_env: MODAL_INFERENCE_URL
    api_key_env: MODAL_API_KEY
    temperature: 0.0
